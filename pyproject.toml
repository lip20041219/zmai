[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zmai"
version = "0.1.0"
description = "Zero-dependency, model-agnostic SWE agent runtime"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Xijing Liu", email = "1653057942@qq.com"},
]
keywords = ["swe-agent", "code-agent", "ai-coding", "llm", "swa-bench", "software-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ZMAI has zero third-party runtime dependencies.
dependencies = []

[project.urls]
Homepage = "https://github.com/lip20041219/zmai"
Repository = "https://github.com/lip20041219/zmai"
Documentation = "https://github.com/lip20041219/zmai#readme"
Changelog = "https://github.com/lip20041219/zmai/blob/main/CHANGELOG.md"
Issues = "https://github.com/lip20041219/zmai/issues"

[project.scripts]
zmai = "zmai.cli.main:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1", "mypy>=1.0"]
# tests/test_swe_fix_driving.py 用真实 Flask 项目验证端到端修复闭环
test = ["pytest>=7", "flask>=3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zmai = ["py.typed"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# tests/hermes_validation 下是自动化验证用的 demo 数据（含故意损坏/不可完成的
# 测试），不应被全量 pytest 收集；本目录的验证由 tests/hermes_validation/*.py
# 驱动脚本单独运行。
norecursedirs = ["hermes_validation"]

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N818"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
