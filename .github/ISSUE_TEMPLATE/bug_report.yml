name: Bug Report
description: Report a bug or unexpected behavior
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: What did you do? What happened? What did you expect?
      placeholder: |
        1. Run `zmai "..."` with config X
        2. See error Y
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your system and ZMAI configuration.
      placeholder: |
        - OS: (e.g. Windows 11, Ubuntu 22.04, macOS 14)
        - Python version: (e.g. 3.11.9)
        - ZMAI version: (e.g. 0.1.0)
        - Backend: (e.g. DeepSeek / Claude / Gemini)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Output of `zmai doctor` (if applicable).
      render: text
