name: Feature Request
description: Suggest an idea for ZMAI
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature!

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What alternatives have you considered?

  - type: checkboxes
    id: area
    attributes:
      label: Area
      description: Which part of ZMAI does this affect?
      options:
        - label: CLI / REPL
        - label: Backend (DeepSeek / Claude / Gemini)
        - label: Agent / SWE Agent
        - label: Tool system
        - label: Workspace
        - label: Memory
        - label: Auth / Credentials
        - label: Documentation
