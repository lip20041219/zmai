name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Type check with mypy
        run: mypy src/zmai/
        continue-on-error: true

      - name: Test with pytest
        shell: bash
        run: |
          set +e
          python -m pytest tests/ --tb=short --ignore=tests/test_live_api.py -q > pytest.out 2>&1
          code=$?
          tail -60 pytest.out
          exit $code

      - name: Report failures (temporary triage)
        if: failure() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        shell: bash
        run: |
          {
            echo "=== FAILED/ERROR ==="
            grep -E '^(FAILED|ERROR)' pytest.out | head -40
            echo "=== tail ==="
            tail -80 pytest.out
          } > ci-failures.txt
          git -c user.email=ci@ci -c user.name=ci add -f ci-failures.txt
          git -c user.email=ci@ci -c user.name=ci commit -m "ci: failure report"
          git push
